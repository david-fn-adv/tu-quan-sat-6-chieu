<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ tự quan sát 6 chiều</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede7;
  --text: #1d1c1a;
  --muted: #6b6860;
  --line: #dedbd2;
  --accent: #1f5f5b;
  --accent-soft: #dcebe9;
  --accent-text: #ffffff;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --danger: #a33a2c;
  --mid-band: rgba(31, 95, 91, 0.08);
  --bar: #1f5f5b;
  --bar-obs: #b0742a;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413;
    --surface: #1d1d1b;
    --surface-2: #262623;
    --text: #ecebe6;
    --muted: #a19e95;
    --line: #34332f;
    --accent: #6cb8b0;
    --accent-soft: #1f3533;
    --accent-text: #0f1f1e;
    --warn: #e7b25e;
    --warn-soft: #3a2e1a;
    --danger: #e98a7c;
    --mid-band: rgba(108, 184, 176, 0.1);
    --bar: #6cb8b0;
    --bar-obs: #e0a65c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; line-height: 1.35; margin: 0 0 12px; }
h3 { font-size: 1.05rem; margin: 0; }
p { margin: 0 0 12px; }
.sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
}
.choices { display: grid; gap: 12px; }
.choice {
  display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
}
.choice:hover { border-color: var(--accent); }
.choice strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
.choice span { color: var(--muted); font-size: 0.92rem; }
.choice .tag { display: block; margin-top: 8px; font-size: 0.8rem; color: var(--accent); font-weight: 600; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 10px 18px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
}
.btn.secondary { background: transparent; color: var(--accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); font-weight: 500; }
.btn.danger { background: transparent; border-color: var(--line); color: var(--danger); font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: space-between; }
label.field { display: block; margin-bottom: 14px; }
label.field span { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; }
input[type=text], textarea {
  width: 100%; font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.intro { background: var(--surface-2); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
.intro p:last-child { margin-bottom: 0; }
.note { font-size: 0.88rem; color: var(--muted); }
.warnbox { background: var(--warn-soft); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; margin-bottom: 16px; }

/* form */
.progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-bottom: 8px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
.track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.track > div { height: 100%; background: var(--accent); transition: width 0.2s; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.item.missing { border-color: var(--danger); }
.item .q { margin-bottom: 12px; }
.item .q b { color: var(--muted); font-weight: 500; margin-right: 6px; }
.opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.opts.with-na { grid-template-columns: repeat(5, 1fr); }
.opt {
  font: inherit; font-size: 0.8rem; line-height: 1.3; cursor: pointer; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
}
.opt .n { font-weight: 700; font-size: 0.95rem; }
.opt:hover { border-color: var(--accent); }
.opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.opt.na { grid-column: 1 / -1; min-height: 38px; flex-direction: row; border-style: dashed; color: var(--muted); }
.opt.na.on { background: var(--surface-2); color: var(--text); border-style: solid; border-color: var(--muted); }
@media (max-width: 560px) {
  .opts, .opts.with-na { grid-template-columns: 1fr; }
  .opt { flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 42px; padding: 8px 12px; text-align: left; }
  .opt .n { width: 18px; }
}

/* results */
.caveat { font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; margin-bottom: 20px; }
.factor { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.factor .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }
.lvl { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.lvl.cao { background: var(--accent-soft); color: var(--accent); }
.lvl.thap { background: var(--warn-soft); color: var(--warn); }
.facet { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 3.2em; gap: 10px; align-items: center; padding: 5px 0; font-size: 0.9rem; }
.facet .nm small { display: block; color: var(--muted); font-size: 0.75rem; }
.scale { position: relative; height: 10px; background: var(--surface-2); border-radius: 99px; }
.scale .band { position: absolute; top: 0; bottom: 0; left: 37.5%; width: 25%; background: var(--mid-band); border-left: 1px dashed var(--line); border-right: 1px dashed var(--line); }
.scale .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--bar); }
.facet .val { text-align: right; font-variant-numeric: tabular-nums; }
.legend { font-size: 0.8rem; color: var(--muted); margin: 0 0 16px; }

/* compare */
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; vertical-align: top; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; }
tr.factor-row td { font-weight: 700; background: var(--surface-2); }
td.diff { color: var(--warn); font-weight: 700; }
.vt { font-size: 0.72rem; color: var(--warn); font-weight: 600; display: block; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; margin-bottom: 16px; }
.status { font-size: 0.9rem; margin-top: 10px; }
.status.ok { color: var(--accent); }
.status.err { color: var(--danger); }
footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); }
.hidden { display: none !important; }
@media (max-width: 560px) {
  .facet { grid-template-columns: minmax(0, 1fr) 3.2em; row-gap: 4px; }
  .facet .nm { grid-column: 1 / -1; }
}
</style>
</head>

  { k: "H", name: "Trung thực–Khiêm nhường", facets: ["Sincerity", "Fairness", "Greed Avoidance", "Modesty"] },

const SCALE_SELF = ["Hoàn toàn không đúng", "Không đúng lắm", "Phân vân", "Khá đúng", "Rất đúng"];
const SCALE_OBS = ["Chưa từng thấy", "Hiếm khi", "Đôi khi", "Thường xuyên", "Hầu như luôn luôn"];
const NA = 0; // "Chưa có dịp quan sát"

const KINDS = {
  self: { items: SELF_ITEMS, sheet: "Self", code: "S" },
  obs: { items: OBS_ITEMS, sheet: "Observer", code: "O" },
};
const VT_FACETS = new Set(OBS_ITEMS.filter(i => i.vt).map(i => i.f));

/* ============================================================
   CHẤM ĐIỂM
   ============================================================ */
const round2 = x => Math.round(x * 100) / 100;
function level(x) {
  if (x == null) return null;
  const v = round2(x);
  return v < 2.5 ? "thấp" : v > 3.5 ? "cao" : "trung bình";
}
// answers: {id: 1..5 | 0 (NA)}
function score(kind, answers) {
  const items = KINDS[kind].items;
  const facet = {}, naCount = {};
  for (const f of ALL_FACETS) {
    const its = items.filter(i => i.f === f);
    const vals = [];
    let na = 0;
    for (const it of its) {
      const a = answers[it.id];
      if (a === NA || a == null) { na++; continue; }
      vals.push(it.r ? 6 - a : a);
    }
    naCount[f] = na;
    // Quy tắc unknown: ≥ 2 câu "Chưa có dịp" thì facet không chấm
    facet[f] = (na >= 2 || vals.length === 0) ? null : vals.reduce((s, v) => s + v, 0) / vals.length;
  }
  const factor = {};
  for (const F of FACTORS) {
    const vals = F.facets.map(f => facet[f]).filter(v => v != null);
    // Nhân tố cần ít nhất 3/4 facet có điểm
    factor[F.k] = vals.length >= 3 ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
  }
  return { facet, factor, naCount };
}

const KEY = "tqs6:" + CONFIG.version;
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}

/* ============================================================
   MÃ KẾT QUẢ — để so sánh self–observer
   ============================================================ */
function digits(kind, answers) {
  return KINDS[kind].items.map(i => String(answers[i.id] ?? NA)).join("");
}
function encode(rec) {
  const obj = { v: CONFIG.version, k: KINDS[rec.kind].code, n: rec.name, s: rec.subject || "", d: (rec.finishedAt || "").slice(0, 10), a: digits(rec.kind, rec.answers) };
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return "TQS6." + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decode(code) {
  let obj;
  try {
    const raw = code.trim().replace(/^TQS6\./, "").replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(raw + "===".slice((raw.length + 3) % 4));
    obj = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch { throw new Error("Mã không hợp lệ hoặc bị cắt thiếu"); }
  const kind = obj.k === "S" ? "self" : obj.k === "O" ? "obs" : null;
  const items = kind && KINDS[kind].items;
  if (!kind || !obj.a || obj.a.length !== items.length || !/^[0-5]+$/.test(obj.a)) throw new Error("Mã không hợp lệ");
  if (kind === "self" && obj.a.includes("0")) throw new Error("Mã tự khai thiếu câu trả lời");
  const answers = {};
  items.forEach((it, idx) => answers[it.id] = Number(obj.a[idx]));
  return { kind, name: obj.n, subject: obj.s, date: obj.d, version: obj.v, answers };
}

}

      const it = byId[id], a = cur.answers[id];
      const n = cur.page * CONFIG.pageSize + k + 1;
      return `<div class="item" data-id="${id}">
        <div class="q"><b>${n}.</b>${esc(isSelf ? it.t : fillName(it.t, cur.subject))}</div>
        <div class="opts${isSelf ? "" : " with-na"}">
          ${labels.map((l, v) => `<button class="opt${a === v + 1 ? " on" : ""}" data-v="${v + 1}"><span class="n">${v + 1}</span><span>${l}</span></button>`).join("")}
          ${isSelf ? "" : `<button class="opt na${a === NA ? " on" : ""}" data-v="0">Chưa có dịp quan sát</button>`}
        </div>
      </div>`;
    }).join("")}
    <div class="row end" style="margin-top:20px">
      <button class="btn ghost" data-act="prev">${cur.page === 0 ? "← Trang chủ" : "← Trang trước"}</button>
      <button class="btn" data-act="next">${cur.page === pages - 1 ? "Xem kết quả" : "Trang tiếp →"}</button>
    </div>
    <div class="status err" id="err"></div>
    ${footer}`;
  app.onclick = e => {
    const opt = e.target.closest(".opt");
    if (opt) {
      const item = opt.closest(".item");
      cur.answers[item.dataset.id] = Number(opt.dataset.v);
      item.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o === opt));
      item.classList.remove("missing");
      const n = Object.keys(cur.answers).length;
      app.querySelector(".track > div").style.width = n + "%";
      app.querySelector(".progress .meta span:last-child").textContent = n + "/100 câu";
      save(); return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "prev") {
      if (cur.page === 0) return go("home");
      cur.page--; save(); return go("form");
    }
    const missing = ids.filter(id => cur.answers[id] == null);
    if (missing.length) {
      missing.forEach(id => app.querySelector(`.item[data-id="${id}"]`).classList.add("missing"));
      document.getElementById("err").textContent = `Còn ${missing.length} câu chưa trả lời trên trang này.`;
      app.querySelector(`.item[data-id="${missing[0]}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (cur.page < pages - 1) { cur.page++; save(); return go("form"); }
    const rec = { id: cur.id, kind: cur.kind, name: cur.name, subject: cur.subject, answers: cur.answers, startedAt: cur.startedAt, finishedAt: new Date().toISOString(), sent: false };
    store.done.unshift(rec);
    delete store.current;
    save(); go("result", rec);
  };
};

function profileHTML(kind, answers) {
  const sc = score(kind, answers);
  const bar = x => x == null ? `<div class="scale"><div class="band"></div></div>` :
    `<div class="scale"><div class="band"></div><div class="fill" style="width:${((x - 1) / 4) * 100}%"></div></div>`;
  const lvl = x => x == null ? `<span class="lvl">không chấm</span>` : `<span class="lvl ${level(x) === "cao" ? "cao" : level(x) === "thấp" ? "thap" : ""}">${level(x)}</span>`;
  const facetRow = f => `<div class="facet"><div class="nm">${FACET_VI[f]}<small>${f}${kind === "obs" && sc.naCount[f] ? ` · ${sc.naCount[f]} câu chưa có dịp` : ""}</small></div>${bar(sc.facet[f])}<div class="val">${fmt(sc.facet[f])}</div></div>`;
  return FACTORS.map(F => `
    <div class="factor">
      <div class="head"><h3>${F.k} · ${F.name}</h3><div class="row"><span class="score">${fmt(sc.factor[F.k])}</span>${lvl(sc.factor[F.k])}</div></div>
      ${F.facets.map(facetRow).join("")}
    </div>`).join("") + `
    <div class="factor">
      <div class="head"><h3>Vị tha <span class="note">(Altruism, facet trung gian)</span></h3><div class="row"><span class="score">${fmt(sc.facet[ALTRUISM])}</span>${lvl(sc.facet[ALTRUISM])}</div></div>
      ${facetRow(ALTRUISM)}
    </div>`;
}

function summaryText(rec) {
  const sc = score(rec.kind, rec.answers);
  const L = [];
  L.push("Bộ tự quan sát 6 chiều — dựa trên mô hình HEXACO · " + CONFIG.version);
  L.push(rec.kind === "self" ? `Tự đánh giá: ${rec.name}` : `Người chấm: ${rec.name} · Người được đánh giá: ${rec.subject}`);
  L.push("Hoàn thành: " + fmtTime(rec.finishedAt));
  L.push("");
  for (const F of FACTORS) {
    L.push(`${F.k} · ${F.name}: ${fmt(sc.factor[F.k])}${sc.factor[F.k] != null ? " (" + level(sc.factor[F.k]) + ")" : ""}`);
    for (const f of F.facets) L.push(`   ${FACET_VI[f]} (${f}): ${fmt(sc.facet[f])}`);
  }
  L.push(`Vị tha (Altruism): ${fmt(sc.facet[ALTRUISM])}`);
  L.push("");
  L.push("Thang 1–5. Thấp < 2,5 · trung bình 2,5–3,5 · cao > 3,5. So với điểm giữa thang, không so với ai.");
  L.push("Chưa kiểm định: đây là khung tự nhìn lại, không phải phép đo.");
  L.push("");
  L.push("Mã kết quả: " + encode(rec));
  return L.join("\n");
}

VIEWS.result = rec => {
  const isSelf = rec.kind === "self";
  const code = encode(rec);
  const canSend = !!CONFIG.endpoint;
  app.innerHTML = `
    <p><button class="btn ghost" data-act="home">← Trang chủ</button></p>
    <h1>${isSelf ? "Kết quả tự đánh giá" : "Kết quả đánh giá " + esc(rec.subject)}</h1>
    <p class="sub">${isSelf ? esc(rec.name) : "Người chấm: " + esc(rec.name)} · ${fmtTime(rec.finishedAt)}</p>
    <div class="caveat">
      ${isSelf
        ? "Đây là lời bạn tự nói về mình, không phải hành vi đã được quan sát. Bộ câu hỏi chưa được kiểm định, nên hãy đọc kết quả như một khung để tự nhìn lại, không phải một phép đo."
        : "Đây là những gì một người quan sát thấy, trong bối cảnh và vai trò của họ. Facet có từ 2 câu \"Chưa có dịp quan sát\" trở lên thì không chấm."}
      Điểm được so với điểm giữa thang (3), không so với ai khác.
    </div>
    <p class="legend">Thang 1–5. Vùng tô nhạt là mức trung bình (2,5–3,5). Thấp &lt; 2,5 · cao &gt; 3,5.</p>
    ${profileHTML(rec.kind, rec.answers)}
    <div class="card" style="margin-top:24px">
      <h2>Gửi kết quả</h2>
      <p>Bấm <strong>Gửi cho ${esc(CONFIG.owner)}</strong> để gửi toàn bộ câu trả lời và điểm ở trên. Bạn có thể chọn không gửi.</p>
      <div class="row">
        <button class="btn" data-act="send" ${canSend ? "" : "disabled"}>${rec.sent ? "Đã gửi · gửi lại" : "Gửi cho " + esc(CONFIG.owner)}</button>
        <button class="btn secondary" data-act="dl">Tải tóm tắt (.txt)</button>
      </div>
      <div class="status ${rec.sent ? "ok" : ""}" id="status">${canSend ? (rec.sent ? "Đã gửi lúc " + fmtTime(rec.sentAt) + "." : "") : "Chức năng gửi chưa được cấu hình."}</div>
    </div>
    <div class="card">
      <h3>Mã kết quả</h3>
      <p class="note">Mã này chứa câu trả lời của bạn. Dùng ở màn hình "So sánh kết quả".</p>
      <textarea readonly id="code">${code}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="copy">Sao chép mã</button></div>
    </div>
    ${footer}`;
  app.onclick = async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "home") return go("home");
    if (act === "copy") {
      const ta = document.getElementById("code"); ta.select();
      try { await navigator.clipboard.writeText(code); } catch { document.execCommand("copy"); }
      b.textContent = "Đã sao chép"; return;
    }
    if (act === "dl") {
      const blob = new Blob([summaryText(rec)], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tu-quan-sat-6-chieu_${isSelf ? "tu-danh-gia" : "danh-gia"}_${(isSelf ? rec.name : rec.subject).replace(/\s+/g, "-")}.txt`;
      a.click(); URL.revokeObjectURL(a.href); return;
    }
    if (act === "send") {
      if (rec.sent && !confirm("Kết quả này đã được gửi. Gửi lại?")) return;
      const st = document.getElementById("status");
      b.disabled = true; st.className = "status"; st.textContent = "Đang gửi…";
      try {
        const res = await fetch(CONFIG.endpoint, { method: "POST", body: JSON.stringify(buildPayload(rec, code)) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error || "lỗi máy chủ");
        rec.sent = true; rec.sentAt = new Date().toISOString(); save();
        st.className = "status ok"; st.textContent = out.duplicate ? "Kết quả này đã có trong bảng, không ghi thêm." : "Đã gửi. Cảm ơn bạn.";
        b.textContent = "Đã gửi · gửi lại";
      } catch (err) {
        st.className = "status err";
        st.textContent = "Chưa gửi được (" + err.message + "). Bạn thử lại sau, hoặc sao chép mã kết quả bên dưới và gửi trực tiếp cho " + CONFIG.owner + ".";
      } finally { b.disabled = false; }
    }
  };
};

function buildPayload(rec, code) {
  const sc = score(rec.kind, rec.answers);
  const isSelf = rec.kind === "self";
  const row = {
    "ID": rec.id,
    "Thời gian gửi": new Date().toISOString(),
    "Phiên bản": CONFIG.version,
    [isSelf ? "Người làm" : "Người chấm"]: rec.name,
  };
  if (!isSelf) row["Người được đánh giá"] = rec.subject;
  row["Bắt đầu"] = rec.startedAt;
  row["Hoàn thành"] = rec.finishedAt;
  row["Thời lượng (phút)"] = Math.round((new Date(rec.finishedAt) - new Date(rec.startedAt)) / 60000);
  if (!isSelf) row["Số câu chưa có dịp"] = Object.values(rec.answers).filter(v => v === NA).length;
  for (const F of FACTORS) row[F.k] = sc.factor[F.k] == null ? "" : round2(sc.factor[F.k]);
  for (const f of ALL_FACETS) row[f] = sc.facet[f] == null ? "" : round2(sc.facet[f]);
  for (const it of KINDS[rec.kind].items) {
    const a = rec.answers[it.id];
    row[it.id] = a === NA ? "NA" : a;
  }
  row["Mã kết quả"] = code;
  return { token: CONFIG.token, sheet: KINDS[rec.kind].sheet, row };
}

VIEWS.compare = () => {
  const local = store.done;
  app.innerHTML = `
    <p><button class="btn ghost" data-act="home">← Trang chủ</button></p>
    <h1>So sánh kết quả</h1>
    <p class="sub">Một bài tự đánh giá so với một hoặc nhiều bài đánh giá từ người khác, ở cấp facet.</p>
    <div class="card">
      <label class="field"><span>Dán mã kết quả, mỗi mã một dòng</span>
        <textarea id="codes" placeholder="TQS6.…"></textarea></label>
      ${local.length ? `<p class="note">Hoặc thêm bài đã làm trên máy này:</p><div class="row" style="margin-bottom:12px">${local.map((d, i) =>
        `<button class="btn ghost" data-act="add" data-i="${i}">${d.kind === "self" ? "Tự đánh giá · " + esc(d.name) : esc(d.name) + " → " + esc(d.subject)}</button>`).join("")}</div>` : ""}
      <button class="btn" data-act="run">So sánh</button>
      <div class="status err" id="err"></div>
    </div>
    <div id="out"></div>
    ${footer}`;
  app.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const ta = document.getElementById("codes");
    if (b.dataset.act === "home") return go("home");
    if (b.dataset.act === "add") { ta.value = (ta.value.trim() + "\n" + encode(local[Number(b.dataset.i)])).trim(); return; }
    const err = document.getElementById("err"); err.textContent = "";
    const recs = [];
    for (const [n, line] of ta.value.split(/\s+/).filter(Boolean).entries()) {
      try { recs.push(decode(line)); } catch (x) { err.textContent = `Mã thứ ${n + 1} không đọc được: ${x.message}.`; return; }
    }
    const selfs = recs.filter(r => r.kind === "self"), obs = recs.filter(r => r.kind === "obs");
    if (selfs.length !== 1) { err.textContent = `Cần đúng một mã tự đánh giá (đang có ${selfs.length}).`; return; }
    if (!obs.length) { err.textContent = "Cần ít nhất một mã đánh giá từ người khác."; return; }
    document.getElementById("out").innerHTML = compareHTML(selfs[0], obs);
  };
};

function compareHTML(self, obs) {
  const s = score("self", self.answers);
  const os = obs.map(o => score("obs", o.answers));
  const subjects = [...new Set(obs.map(o => o.subject))];
  const mean = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const cell = (x, ref) => {
    const differs = x != null && ref != null && level(x) !== level(ref);
    return `<td class="${differs ? "diff" : ""}">${fmt(x)}</td>`;
  };
  const delta = (a, b) => (a == null || b == null) ? "—" : (a - b >= 0 ? "+" : "") + fmt(a - b);
  const head = `<tr><th>Facet</th><th>Tự khai</th>${obs.map(o => `<th>${esc(o.name)}</th>`).join("")}${obs.length > 1 ? "<th>TB người khác</th>" : ""}<th>Lệch</th></tr>`;
  const facetRow = f => {
    const ov = os.map(x => x.facet[f]), m = mean(ov);
    return `<tr><td>${FACET_VI[f]}${VT_FACETS.has(f) ? `<span class="vt">có câu nhạy với vai trò</span>` : ""}</td>
      <td>${fmt(s.facet[f])}</td>${ov.map(v => cell(v, s.facet[f])).join("")}${obs.length > 1 ? cell(m, s.facet[f]) : ""}<td>${delta(m, s.facet[f])}</td></tr>`;
  };
  const rows = FACTORS.map(F => {
    const ov = os.map(x => x.factor[F.k]), m = mean(ov);
    return `<tr class="factor-row"><td>${F.k} · ${F.name}</td><td>${fmt(s.factor[F.k])}</td>${ov.map(v => `<td>${fmt(v)}</td>`).join("")}${obs.length > 1 ? `<td>${fmt(m)}</td>` : ""}<td>${delta(m, s.factor[F.k])}</td></tr>` + F.facets.map(facetRow).join("");
  }).join("") + `<tr class="factor-row"><td colspan="${obs.length + (obs.length > 1 ? 4 : 3)}">Vị tha</td></tr>` + facetRow(ALTRUISM);
  return `
    <h2>${esc(self.name)}${subjects.length === 1 && subjects[0] !== self.name ? ` <span class="note">(người được đánh giá ghi là "${esc(subjects[0])}")</span>` : ""}</h2>
    <div class="caveat">
      Lệch = điểm người khác − điểm tự khai. Ô <span style="color:var(--warn);font-weight:700">màu cam</span> là khi người khác xếp facet đó vào mức khác (thấp / trung bình / cao) so với tự khai.
      Hai form dùng hai thang khác nhau (mức đồng ý và tần suất), nên độ lệch là tín hiệu để trao đổi, không phải con số chính xác.
      Facet có ghi "nhạy với vai trò" có thể lệch vì cấp bậc hay vị trí, không hẳn là điểm mù. "—" là facet không chấm (từ 2 câu "Chưa có dịp" trở lên).
    </div>
    <div class="table-wrap"><table>${head}${rows}</table></div>`;
}

go("home");
</script>
</body>
</html>
